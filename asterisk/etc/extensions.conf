; Hermes dialplan: incoming only. Whatever number the Fritz!Box rings us with,
; the call goes to [hermes]. There is deliberately no context that can dial
; out; outgoing legs are created by the ARI app only.

[globals]
; "stasis": hand the call to the Phoenix app (normal operation)
; "test":   answer and play a test announcement (line check without the app)
CALL_MODE = ${HERMES_CALL_MODE}

[from-fritzbox]
exten => _[0-9a-zA-Z*#+].,1,Goto(hermes,s,1)
exten => _[0-9a-zA-Z*#+],1,Goto(hermes,s,1)
exten => s,1,Goto(hermes,s,1)

[hermes]
exten => s,1,GotoIf($["${CALL_MODE}" = "test"]?test,1)
 same => n,Stasis(hermes)
 same => n,Hangup()

exten => test,1,NoOp(Hermes test mode)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Hangup()
