; Hermes: Asterisk registers at the Fritz!Box as an IP phone ("LAN/WLAN (IP-Telefon)").
;
; Incoming: the Fritz!Box rings this IP phone for the landline number, the call
;           lands in [from-fritzbox] and from there in the ARI app.
; Outgoing: only the ARI app dials, as PJSIP/<number>@fritzbox. There is no
;           dialplan context that dials out.
;
; Only the Fritz!Box is accepted as a peer (type=identify below). There is no
; anonymous endpoint, so SIP requests from anywhere else are rejected.

[global]
type = global
user_agent = Hermes
endpoint_identifier_order = ip,username

[transport-udp]
type = transport
protocol = udp
; Only the LAN interface facing the Fritz!Box (host networking).
bind = ${SIP_BIND_ADDRESS}:5060

[fritzbox-auth]
type = auth
auth_type = userpass
username = ${FRITZBOX_SIP_USER}
password = ${FRITZBOX_SIP_PASSWORD}

[fritzbox]
type = registration
transport = transport-udp
outbound_auth = fritzbox-auth
server_uri = sip:${FRITZBOX_HOST}
client_uri = sip:${FRITZBOX_SIP_USER}@${FRITZBOX_HOST}
contact_user = ${FRITZBOX_SIP_USER}
expiration = 300
retry_interval = 30
forbidden_retry_interval = 300
fatal_retry_interval = 300
max_retries = 1000000
line = yes
endpoint = fritzbox

[fritzbox]
type = aor
contact = sip:${FRITZBOX_HOST}
qualify_frequency = 60

[fritzbox]
type = endpoint
transport = transport-udp
context = from-fritzbox
aors = fritzbox
outbound_auth = fritzbox-auth
from_user = ${FRITZBOX_SIP_USER}
from_domain = ${FRITZBOX_HOST}
; G.711 A-law is what German networks use; G.722 for HD voice where available.
disallow = all
allow = alaw,g722
; Media always flows through Asterisk: the bridge is what keeps caller and
; mobile number apart.
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; The "press 1 to accept" confirmation relies on RFC 4733 DTMF.
dtmf_mode = rfc4733
; Privacy: never pass identities or connected-line updates between the legs.
send_pai = no
send_rpid = no
trust_id_inbound = no
trust_id_outbound = no
send_connected_line = no
trust_connected_line = no

[fritzbox]
type = identify
endpoint = fritzbox
match = ${FRITZBOX_HOST}
