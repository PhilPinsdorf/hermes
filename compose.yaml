# Production stack, one instance per customer. Configure via .env (see .env.example, bin/setup).
# Fritz!Box setup: docs/fritzbox.md
#
# The images are built by .github/workflows/images.yml and published to the
# GitHub package registry, so a rollout pulls them instead of compiling
# Asterisk on the customer's machine:
#
#   docker compose pull && docker compose up -d
#
# `build:` is kept so `docker compose up -d --build` still builds from this
# checkout — for a change that is not published yet, or without a registry.
# HERMES_TAG pins a version (`latest` follows the main branch).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run bin/setup first}
      POSTGRES_DB: hermes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: ghcr.io/philpinsdorf/hermes/app:${HERMES_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PORT: "4000"
      DATABASE_URL: ecto://hermes:${POSTGRES_PASSWORD}@db/hermes
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?run bin/setup first}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_URL_SCHEME: ${PHX_URL_SCHEME:-http}
      PHX_URL_PORT: ${PHX_URL_PORT:-4000}
      ARI_URL: ${ARI_URL:-http://host.docker.internal:8088}
      ARI_USER: ${ARI_USER:-hermes}
      ARI_PASSWORD: ${ARI_PASSWORD:?run bin/setup first}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Announcements: written by Hermes, played by Asterisk (same path in both).
      - sounds:/var/lib/asterisk/sounds/hermes
    ports:
      - "${HTTP_BIND:-127.0.0.1}:4000:4000"

  # SIP/RTP through Docker NAT is a constant source of one-way audio, so Asterisk
  # uses the host network. It binds SIP to the LAN interface only and ARI to the
  # Docker bridge only (see asterisk/entrypoint.sh).
  asterisk:
    build: ./asterisk
    image: ghcr.io/philpinsdorf/hermes/asterisk:${HERMES_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    environment:
      FRITZBOX_HOST: ${FRITZBOX_HOST:-192.168.178.1}
      FRITZBOX_SIP_USER: ${FRITZBOX_SIP_USER:-}
      FRITZBOX_SIP_PASSWORD: ${FRITZBOX_SIP_PASSWORD:-}
      SIP_BIND_ADDRESS: ${SIP_BIND_ADDRESS:-}
      ARI_BIND_ADDRESS: ${ARI_BIND_ADDRESS:-}
      ARI_USER: ${ARI_USER:-hermes}
      ARI_PASSWORD: ${ARI_PASSWORD:?run bin/setup first}
      HERMES_CALL_MODE: ${HERMES_CALL_MODE:-test}
    volumes:
      - sounds:/var/lib/asterisk/sounds/hermes

  # Optional: public access through a Cloudflare Tunnel. Only started with the
  # "tunnel" profile:
  #   docker compose --profile tunnel up -d
  #
  # The tunnel dials out from here, so no port has to be opened in the router
  # and nothing has to listen on the LAN. TLS and the certificate belong to
  # Cloudflare; Hermes needs no reverse proxy of its own.
  #
  # Any other reverse proxy (Traefik, nginx, Caddy) works just as well — it
  # only has to pass X-Forwarded-Proto and allow websockets. See
  # docs/rollout.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      # Must be set in .env before starting the profile; compose checks every
      # service's variables, so a required one here would break `up` for
      # installations that use no tunnel at all.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata:
  sounds:
